<!DOCTYPE html>
<html lang="sk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nutri Planner | Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/static/css/styles.css" />
  </head>
  <body class="auth-bg min-h-screen has-sticky-footer">
    <main class="flex items-center justify-center px-4 py-10">
      <div class="card-glass w-full max-w-md p-8 animate-fade-in">
      <div class="text-center mb-6">
        <h1 class="text-3xl font-bold text-white">Nutri Planner</h1>
        <p class="text-slate-200 mt-2">Prihlás sa a spravuj svoj plán stravy.</p>
      </div>

      <div class="flex gap-2 mb-4">
        <button id="mode-login" class="btn-secondary w-full" type="button">Prihlásenie</button>
        <button id="mode-register" class="btn-secondary w-full" type="button">Registrácia</button>
      </div>

      <form id="login-form" class="space-y-4">
        <div>
          <label for="email" class="text-sm text-slate-200">Email</label>
          <input
            id="email"
            name="email"
            type="email"
            required
            class="form-input mt-1"
            placeholder="tvoj@email.com"
          />
        </div>
        <div>
          <label for="password" class="text-sm text-slate-200">Heslo</label>
          <input
            id="password"
            name="password"
            type="password"
            required
            class="form-input mt-1"
            placeholder="********"
          />
        </div>
        <button id="submit-btn" type="submit" class="btn-primary w-full">Prihlásiť sa</button>
      </form>

        <p id="error-message" class="text-red-300 text-sm mt-3 hidden"></p>
      </div>
    </main>

    <footer class="site-footer">
      <p>© 2026 Všetky práva vyhradené — Palatický Enterprise</p>
    </footer>

    <script src="/static/js/common.js" defer></script>
    <script src="/static/js/login.js" defer></script>
  </body>
</html>
