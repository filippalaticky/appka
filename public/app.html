<!DOCTYPE html>
<html lang="sk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nutri Planner | Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/static/css/styles.css" />
  </head>
  <body class="app-bg min-h-screen text-slate-100">
    <header class="border-b border-slate-700/60 sticky top-0 backdrop-blur-md bg-slate-900/60 z-10">
      <div class="max-w-6xl mx-auto px-4 py-4 flex items-center justify-between">
        <h1 class="text-2xl font-bold tracking-tight">Nutri Planner</h1>
        <div class="flex gap-2 items-center">
          <a id="admin-link" href="/admin" class="btn-secondary hidden">Admin panel</a>
          <button id="logout-btn" class="btn-secondary">Odhlásiť sa</button>
        </div>
      </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 py-8 space-y-8">
      <section class="card-dark animate-slide-in">
        <h2 class="text-xl font-semibold mb-4">Kalorická kalkulačka</h2>
        <form id="profile-form" class="grid md:grid-cols-2 gap-4">
          <div>
            <label class="text-sm text-slate-300">Meno</label>
            <input class="form-input mt-1" id="name" required />
          </div>
          <div>
            <label class="text-sm text-slate-300">Výška (cm)</label>
            <input class="form-input mt-1" id="height" type="number" required min="120" max="240" />
          </div>
          <div>
            <label class="text-sm text-slate-300">Vek</label>
            <input class="form-input mt-1" id="age" type="number" required min="15" max="90" />
          </div>
          <div>
            <label class="text-sm text-slate-300">Váha (kg)</label>
            <input class="form-input mt-1" id="weight" type="number" required min="35" max="250" />
          </div>
          <div>
            <label class="text-sm text-slate-300">Pohlavie</label>
            <select class="form-input mt-1" id="gender" required>
              <option value="muz">Muž</option>
              <option value="zena">Žena</option>
            </select>
          </div>
          <div>
            <label class="text-sm text-slate-300">Počet tréningov týždenne</label>
            <select class="form-input mt-1" id="activity-level" required>
              <option value="1-2x">1–2×</option>
              <option value="3-4x">3–4×</option>
              <option value="5-6x">5–6×</option>
              <option value="7x">7×</option>
            </select>
          </div>
          <div class="md:col-span-2">
            <label class="text-sm text-slate-300">Cieľ</label>
            <select class="form-input mt-1" id="goal" required>
              <option value="schudnut">Schudnúť</option>
              <option value="nabrat">Nabrať svaly</option>
              <option value="udrzat">Udržiavať</option>
            </select>
          </div>
          <div class="md:col-span-2 flex gap-3 mt-1">
            <button type="submit" class="btn-primary">Vypočítať a uložiť profil</button>
            <button id="generate-plan-btn" type="button" class="btn-secondary hidden">Vytvoriť jedálniček</button>
          </div>
        </form>
        <p id="profile-message" class="mt-4 text-sm"></p>
      </section>

      <section id="results-section" class="hidden card-dark">
        <h2 class="text-xl font-semibold mb-4">Tvoje výsledky</h2>
        <div class="grid md:grid-cols-3 gap-4 mb-6">
          <div class="metric-card">
            <p class="metric-label">BMI</p>
            <p id="bmi-value" class="metric-value"></p>
          </div>
          <div class="metric-card">
            <p class="metric-label">Ideálna váha</p>
            <p id="ideal-weight-value" class="metric-value"></p>
          </div>
          <div class="metric-card">
            <p class="metric-label">Denné kalórie</p>
            <p id="calories-value" class="metric-value"></p>
          </div>
        </div>

        <div class="space-y-4">
          <div>
            <div class="macro-row"><span>Bielkoviny</span><span id="protein-value"></span></div>
            <div class="progress-wrap"><div id="protein-bar" class="progress-fill"></div></div>
          </div>
          <div>
            <div class="macro-row"><span>Sacharidy</span><span id="carbs-value"></span></div>
            <div class="progress-wrap"><div id="carbs-bar" class="progress-fill"></div></div>
          </div>
          <div>
            <div class="macro-row"><span>Tuky</span><span id="fat-value"></span></div>
            <div class="progress-wrap"><div id="fat-bar" class="progress-fill"></div></div>
          </div>
          <div>
            <div class="macro-row"><span>Vláknina</span><span id="fiber-value"></span></div>
            <div class="progress-wrap"><div id="fiber-bar" class="progress-fill"></div></div>
          </div>
        </div>
      </section>

      <section id="meal-plan-section" class="hidden card-dark">
        <h2 class="text-xl font-semibold mb-4">Týždenný jedálniček</h2>
        <div id="meal-plan-grid" class="grid lg:grid-cols-2 gap-4"></div>
      </section>
    </main>

    <div id="meal-detail-modal" class="hidden modal-root">
      <div id="modal-overlay" class="modal-overlay"></div>
      <article class="modal-panel animate-modal-in">
        <div class="flex items-start justify-between gap-3">
          <h3 id="meal-detail-name" class="text-xl font-semibold text-slate-100"></h3>
          <button id="modal-close-btn" class="btn-secondary">Zavrieť</button>
        </div>
        <div id="meal-detail-totals" class="mt-4"></div>
        <div class="mt-5 space-y-2">
          <h4 class="text-sm uppercase tracking-wide text-teal-300">Ingrediencie a gramáže</h4>
          <div id="meal-detail-ingredients" class="space-y-2"></div>
        </div>
      </article>
    </div>

    <script src="/static/js/app.js" defer></script>
  </body>
</html>
