services:
  - type: web
    name: nutri-planner-app
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    autoDeploy: true
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: nutri-planner-db
          property: connectionString
      # sync: false = hodnotu zadáš v Render dashboarde a NIKDY nie je v repozitári.
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # Voliteľné: domény, ktoré smú volať API z iného originu (oddelené čiarkou).
      - key: ALLOWED_ORIGINS
        sync: false
    # Demo účet sa v produkcii zámerne nevytvára - bol by verejne známym prístupom.

databases:
  - name: nutri-planner-db
    databaseName: nutrition_app
    plan: free
