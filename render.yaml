services:
  - type: web
    name: nutri-planner-app
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    autoDeploy: true
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: nutri-planner-db
          property: connectionString
      # sync: false = hodnotu zadáš v Render dashboarde a NIKDY nie je v repozitári.
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # Bežní používatelia. Počet nie je obmedzený - ďalší sa pridá dvojicou
      # USER3_EMAIL / USER3_PASSWORD priamo v Render dashboarde.
      - key: USER1_EMAIL
        sync: false
      - key: USER1_PASSWORD
        sync: false
      - key: USER2_EMAIL
        sync: false
      - key: USER2_PASSWORD
        sync: false
      # Voliteľné: cudzie domény, ktoré smú volať API (vlastná je povolená vždy).
      - key: ALLOWED_ORIGINS
        sync: false

databases:
  - name: nutri-planner-db
    databaseName: nutrition_app
    plan: free
